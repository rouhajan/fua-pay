name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_PASSWORD: ci-admin-not-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.303"

      - name: Prepare limited PostgreSQL role and database
        shell: bash
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail

          docker exec "$POSTGRES_CONTAINER" \
            psql \
            --username=postgres \
            --dbname=postgres \
            --set=ON_ERROR_STOP=1 \
            --command="CREATE ROLE fuapay_migrator NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE; CREATE ROLE fuapay_deployer LOGIN PASSWORD 'ci-deployer-not-secret' NOSUPERUSER NOCREATEDB NOCREATEROLE; GRANT fuapay_migrator TO fuapay_deployer;"

          docker exec "$POSTGRES_CONTAINER" \
            psql \
            --username=postgres \
            --dbname=postgres \
            --set=ON_ERROR_STOP=1 \
            --command="CREATE DATABASE fuapay_test_ci OWNER fuapay_migrator;"

      - name: Verify application
        shell: pwsh
        run: ./scripts/verify.ps1

      - name: Package EF Core migration SQL
        shell: pwsh
        env:
          ConnectionStrings__FuaPay: "Host=127.0.0.1;Port=5432;Database=fuapay_test_ci;Username=fuapay_deployer;Password=ci-deployer-not-secret;Pooling=false"
        run: |
          $ErrorActionPreference = "Stop"

          $migrationDirectory =
              Join-Path $env:RUNNER_TEMP "fuapay-migrations"
          $originalSql =
              Join-Path $migrationDirectory "fuapay-migrations.sql"
          $executionSql =
              Join-Path $migrationDirectory "fuapay-migrations.execution.sql"

          New-Item `
              -ItemType Directory `
              -Path $migrationDirectory `
              -ErrorAction Stop | Out-Null

          & dotnet ef migrations script `
              --idempotent `
              --project src/FuaPay.Web/FuaPay.Web.csproj `
              --startup-project src/FuaPay.Web/FuaPay.Web.csproj `
              --context FuaPayDbContext `
              --configuration Release `
              --no-build `
              --output $originalSql

          if ($LASTEXITCODE -ne 0) {
            throw "EF migration SQL generation failed."
          }

          & dotnet run `
              --project tools/FuaPay.DeploymentArtifacts/FuaPay.DeploymentArtifacts.csproj `
              --configuration Release `
              --no-build `
              -- `
              migrations prepare `
              --input $originalSql `
              --output $executionSql `
              --role fuapay_migrator

          if ($LASTEXITCODE -ne 0) {
            throw "Migration SQL packaging failed."
          }

          & dotnet run `
              --project tools/FuaPay.DeploymentArtifacts/FuaPay.DeploymentArtifacts.csproj `
              --configuration Release `
              --no-build `
              -- `
              migrations verify `
              --original $originalSql `
              --execution $executionSql `
              --role fuapay_migrator

          if ($LASTEXITCODE -ne 0) {
            throw "Migration SQL exact-byte verification failed."
          }

      - name: Apply packaged migrations to isolated database
        shell: pwsh
        env:
          PGPASSWORD: "ci-deployer-not-secret"
          PGSSLMODE: "disable"
        run: |
          $ErrorActionPreference = "Stop"

          $databaseHost = "127.0.0.1"
          $databasePort = "5432"
          $databaseName = "fuapay_test_ci"
          $databaseLogin = "fuapay_deployer"
          $executionSql = Join-Path `
              $env:RUNNER_TEMP `
              "fuapay-migrations/fuapay-migrations.execution.sql"
          $targetArguments = @(
              "--host=$databaseHost"
              "--port=$databasePort"
              "--dbname=$databaseName"
              "--username=$databaseLogin"
          )

          $identityOutput = (
              & psql `
                  @targetArguments `
                  --no-psqlrc `
                  --set=ON_ERROR_STOP=1 `
                  --tuples-only `
                  --no-align `
                  "--field-separator=|" `
                  --command="SELECT current_database(), current_user, COALESCE(inet_server_addr()::text, 'local-socket'), inet_server_port();"
          ) -join "`n"

          if ($LASTEXITCODE -ne 0) {
            throw "PostgreSQL target identity preflight failed."
          }

          $identity = $identityOutput.Trim().Split("|")

          if ($identity.Count -ne 4 -or
              $identity[0] -ne $databaseName -or
              $identity[1] -ne $databaseLogin -or
              [string]::IsNullOrWhiteSpace($identity[2]) -or
              $identity[3] -ne $databasePort) {
            throw "PostgreSQL target identity did not match the explicit target."
          }

          Write-Host (
              "Verified PostgreSQL target: " +
              "database=$($identity[0]), user=$($identity[1]), " +
              "server=$($identity[2]):$($identity[3])"
          )

          & psql `
              @targetArguments `
              --no-psqlrc `
              --set=ON_ERROR_STOP=1 `
              "--file=$executionSql"

          if ($LASTEXITCODE -ne 0) {
            throw "Packaged migration SQL execution failed."
          }

          $historyOwner = (
              & psql `
                  @targetArguments `
                  --no-psqlrc `
                  --set=ON_ERROR_STOP=1 `
                  --tuples-only `
                  --no-align `
                  --command="SELECT pg_get_userbyid(c.relowner) FROM pg_class AS c JOIN pg_namespace AS n ON n.oid = c.relnamespace WHERE n.nspname = 'app' AND c.relname = '__ef_migrations_history';"
          ) -join "`n"

          if ($LASTEXITCODE -ne 0 -or
              $historyOwner.Trim() -ne "fuapay_migrator") {
            throw "Migration objects were not created under fuapay_migrator."
          }

      - name: Run PostgreSQL integration tests
        shell: bash
        env:
          FUA_PAY_DATABASE_TESTS_ALLOWED: "1"
          ConnectionStrings__FuaPay: "Host=127.0.0.1;Port=5432;Database=fuapay_test_ci;Username=fuapay_deployer;Password=ci-deployer-not-secret;Pooling=false"
        run: |
          set -euo pipefail

          dotnet test \
            tests/FuaPay.DatabaseTests/FuaPay.DatabaseTests.csproj \
            --configuration Release \
            --no-build \
            --no-restore

      - name: Audit NuGet vulnerabilities
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $json = (
              & dotnet package list `
                  --project FuaPay.slnx `
                  --vulnerable `
                  --include-transitive `
                  --no-restore `
                  --format json `
                  --output-version 1
          ) -join "`n"

          if ($LASTEXITCODE -ne 0) {
              throw "NuGet vulnerability audit command failed."
          }

          $report = $json | ConvertFrom-Json
          $findings = @()

          foreach ($project in @($report.projects)) {
              foreach ($framework in @($project.frameworks)) {
                  $packages =
                      @($framework.topLevelPackages) +
                      @($framework.transitivePackages)

                  foreach ($package in $packages) {
                      if ($null -eq $package) {
                          continue
                      }

                      foreach ($vulnerability in @($package.vulnerabilities)) {
                          if ($null -ne $vulnerability) {
                              $findings += $vulnerability
                          }
                      }
                  }
              }
          }

          if ($findings.Count -ne 0) {
              $findings | Format-Table -AutoSize
              throw "Known NuGet vulnerabilities were found."
          }

          Write-Host "Known NuGet vulnerabilities: 0"

      - name: Locked restore for linux-x64
        shell: bash
        run: |
          set -euo pipefail

          dotnet restore \
            src/FuaPay.Web/FuaPay.Web.csproj \
            --runtime linux-x64 \
            --locked-mode

      - name: Publish linux-x64 self-contained
        shell: bash
        run: |
          set -euo pipefail

          dotnet publish \
            src/FuaPay.Web/FuaPay.Web.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained \
            --no-restore \
            --output "$RUNNER_TEMP/fuapay-linux-x64" \
            -p:TreatWarningsAsErrors=true

          test -f "$RUNNER_TEMP/fuapay-linux-x64/FuaPay.Web"
          test -f "$RUNNER_TEMP/fuapay-linux-x64/FuaPay.Web.dll"
          test -f "$RUNNER_TEMP/fuapay-linux-x64/FuaPay.Web.deps.json"
          test -f "$RUNNER_TEMP/fuapay-linux-x64/FuaPay.Web.runtimeconfig.json"

      - name: Package and verify deterministic release archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $publishDirectory =
              Join-Path $env:RUNNER_TEMP "fuapay-linux-x64"
          $archivePath =
              Join-Path $env:RUNNER_TEMP "fuapay-linux-x64.tar.gz"

          & dotnet run `
              --project tools/FuaPay.DeploymentArtifacts/FuaPay.DeploymentArtifacts.csproj `
              --configuration Release `
              --no-build `
              -- `
              release create `
              --source $publishDirectory `
              --archive $archivePath

          if ($LASTEXITCODE -ne 0) {
            throw "Release archive packaging failed."
          }

          & dotnet run `
              --project tools/FuaPay.DeploymentArtifacts/FuaPay.DeploymentArtifacts.csproj `
              --configuration Release `
              --no-build `
              -- `
              release verify `
              --archive $archivePath

          if ($LASTEXITCODE -ne 0) {
            throw "Release archive verification failed."
          }

      - name: Verify extracted release modes
        shell: bash
        run: |
          set -euo pipefail

          archive="$RUNNER_TEMP/fuapay-linux-x64.tar.gz"
          extracted="$RUNNER_TEMP/fuapay-linux-x64-extracted"
          sudo groupadd --system fuapay
          sudo useradd \
            --system \
            --gid fuapay \
            --no-create-home \
            --shell /usr/sbin/nologin \
            fuapay
          sudo install \
            --directory \
            --owner=root \
            --group=root \
            --mode=0770 \
            "$extracted"
          sudo tar \
            --extract \
            --gzip \
            --preserve-permissions \
            --no-same-owner \
            --file="$archive" \
            --directory="$extracted"
          sudo chown --recursive fuapay:fuapay "$extracted"
          set -x

          unexpected_owner="$(
            sudo find "$extracted" \
              \( ! -user fuapay -o ! -group fuapay \) \
              -print \
              -quit
          )"
          test -z "$unexpected_owner"

          while IFS= read -r -d '' directory; do
            mode="$(sudo stat --format='%a' "$directory")"
            test "$mode" = "770"
          done < <(sudo find "$extracted" -type d -print0)

          while IFS= read -r -d '' file; do
            mode="$(sudo stat --format='%a' "$file")"
            test "$mode" = "660"
          done < <(
            sudo find "$extracted" \
              -type f \
              ! -path "$extracted/FuaPay.Web" \
              -print0
          )

          test "$(sudo stat --format='%a' "$extracted/FuaPay.Web")" = "750"
          sudo --user=fuapay test -x "$extracted/FuaPay.Web"

      - name: Verify repository stayed clean
        shell: bash
        run: |
          set -euo pipefail

          git diff --check
          git diff --exit-code

          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            exit 1
          fi
